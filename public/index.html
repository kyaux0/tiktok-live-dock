<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TikTok LIVE Stats</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {

    padding: 10px;

    background: #08090c;

    color: #ffffff;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;

    -webkit-font-smoothing: antialiased;

    text-rendering: optimizeLegibility;
}

.dock {

    width: 100%;

    max-width: 900px;

    margin: 0 auto;

    padding: 12px;

    background:
        linear-gradient(
            180deg,
            rgba(22,23,29,0.98),
            rgba(13,14,18,0.98)
        );

    border:
        1px solid
        rgba(255,255,255,0.08);

    border-radius: 12px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.35);
}


/* ============================================================
   TOP BAR
   ============================================================ */

.topbar {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 10px;
}

.identity {

    min-width: 0;
}

.title {

    font-size: 16px;

    line-height: 1;

    font-weight: 850;

    letter-spacing: -0.2px;
}

.username-display {

    margin-top: 4px;

    color: #747780;

    font-size: 10px;

    font-weight: 700;
}


/* ============================================================
   STATUS
   ============================================================ */

.status {

    display: flex;

    align-items: center;

    gap: 7px;

    flex-shrink: 0;

    padding: 7px 10px;

    border:
        1px solid
        rgba(255,255,255,0.07);

    border-radius: 8px;

    background:
        rgba(255,255,255,0.035);

    color: #a5a8b0;

    font-size: 9px;

    font-weight: 850;

    white-space: nowrap;
}

.status-dot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: #ef4444;
}

.status-dot.online {

    background: #22c55e;

    box-shadow:
        0 0 9px
        rgba(34,197,94,0.45);
}

.status-dot.connecting {

    background: #eab308;

    box-shadow:
        0 0 8px
        rgba(234,179,8,0.4);
}


/* ============================================================
   STATS
   ============================================================ */

.stats {

    display: grid;

    grid-template-columns:
        repeat(6, minmax(0, 1fr));

    gap: 7px;

    margin-bottom: 9px;
}

.stat {

    min-width: 0;

    padding:
        9px 8px;

    border:
        1px solid
        rgba(255,255,255,0.055);

    border-radius: 9px;

    background:
        rgba(255,255,255,0.035);

    text-align: center;
}

.stat-icon {

    height: 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 3px;

    font-size: 15px;
}

.stat-value {

    color: #f4f4f5;

    font-size: 16px;

    line-height: 1.05;

    font-weight: 850;

    letter-spacing: -0.25px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.stat-sub {

    margin-top: 3px;

    color: #656872;

    font-size: 7px;

    line-height: 1;

    font-weight: 750;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* ============================================================
   USERNAME
   ============================================================ */

.username-section {

    display: flex;

    gap: 7px;

    align-items: center;
}

.username-input {

    flex: 1;

    min-width: 0;

    height: 34px;

    padding:
        0 10px;

    border:
        1px solid
        rgba(255,255,255,0.08);

    border-radius: 8px;

    outline: none;

    background:
        rgba(255,255,255,0.045);

    color: #eeeeef;

    font-family: inherit;

    font-size: 10px;

    font-weight: 700;
}

.username-input::placeholder {

    color: #555861;
}

.username-input:focus {

    border-color:
        rgba(255,255,255,0.18);

    background:
        rgba(255,255,255,0.06);
}

.connect-button {

    height: 34px;

    padding:
        0 13px;

    border:
        1px solid
        rgba(34,197,94,0.22);

    border-radius: 8px;

    background:
        rgba(34,197,94,0.12);

    color: #70e69d;

    font-family: inherit;

    font-size: 9px;

    font-weight: 850;

    cursor: pointer;

    white-space: nowrap;
}

.connect-button:hover {

    background:
        rgba(34,197,94,0.18);

    color: #9af2bb;
}


/* ============================================================
   ERROR
   ============================================================ */

.error {

    margin-top: 7px;

    padding:
        7px 9px;

    border:
        1px solid
        rgba(239,68,68,0.15);

    border-radius: 7px;

    background:
        rgba(239,68,68,0.07);

    color: #f87171;

    font-size: 9px;
}


/* ============================================================
   RESPONSIVE
   ============================================================ */

@media (max-width: 650px) {

    .stats {

        grid-template-columns:
            repeat(3, minmax(0, 1fr));

    }

}

@media (max-width: 400px) {

    .topbar {

        align-items:
            flex-start;

    }

    .status {

        font-size: 8px;

        padding:
            6px 7px;

    }

    .stats {

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

    }

    .username-section {

        flex-direction: column;

    }

    .username-input,
    .connect-button {

        width: 100%;

    }

}

</style>

</head>

<body>

<div class="dock">


    <!-- ======================================================
         HEADER
         ====================================================== -->

    <div class="topbar">

        <div class="identity">

            <div class="title">
                TikTok LIVE
            </div>

            <div
                class="username-display"
                id="usernameDisplay"
            >
                @—
            </div>

        </div>


        <div class="status">

            <div
                id="statusDot"
                class="status-dot"
            ></div>

            <span id="statusText">
                LIVE DISCONNECTED
            </span>

        </div>

    </div>


    <!-- ======================================================
         STATS
         ====================================================== -->

    <div class="stats">


        <div class="stat">

            <div class="stat-icon">
                👁️
            </div>

            <div
                class="stat-value"
                id="viewers"
            >
                0
            </div>

            <div class="stat-sub">
                VIEWERS
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                ❤️
            </div>

            <div
                class="stat-value"
                id="likes"
            >
                0
            </div>

            <div class="stat-sub">
                LIKES
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                👤
            </div>

            <div
                class="stat-value"
                id="followers"
            >
                —
            </div>

            <div class="stat-sub">
                FOLLOWERS
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                ➕
            </div>

            <div
                class="stat-value"
                id="newFollowers"
            >
                0
            </div>

            <div class="stat-sub">
                NEW THIS LIVE
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                💎
            </div>

            <div
                class="stat-value"
                id="diamonds"
            >
                0
            </div>

            <div class="stat-sub">
                DIAMONDS
            </div>

        </div>


        <div class="stat">

            <div class="stat-icon">
                💵
            </div>

            <div
                class="stat-value"
                id="usd"
            >
                $0.00
            </div>

            <div class="stat-sub">
                EST. USD
            </div>

        </div>

    </div>


    <!-- ======================================================
         USERNAME
         ====================================================== -->

    <div class="username-section">

        <input
            id="usernameInput"
            class="username-input"
            type="text"
            placeholder="TikTok username..."
            autocomplete="off"
            spellcheck="false"
        >

        <button
            id="connectButton"
            class="connect-button"
        >
            SAVE & CONNECT
        </button>

    </div>


    <div
        id="errorBox"
        class="error"
        style="display:none;"
    ></div>

</div>


<script>

/* ============================================================
   ELEMENTS
   ============================================================ */

const viewers =
    document.getElementById("viewers");

const likes =
    document.getElementById("likes");

const followers =
    document.getElementById("followers");

const newFollowers =
    document.getElementById("newFollowers");

const diamonds =
    document.getElementById("diamonds");

const usd =
    document.getElementById("usd");

const usernameInput =
    document.getElementById("usernameInput");

const usernameDisplay =
    document.getElementById("usernameDisplay");

const connectButton =
    document.getElementById("connectButton");

const statusDot =
    document.getElementById("statusDot");

const statusText =
    document.getElementById("statusText");

const errorBox =
    document.getElementById("errorBox");


/* ============================================================
   WEBSOCKET
   ============================================================ */

let socket = null;


function connectWebSocket() {

    socket =
        new WebSocket(
            "ws://localhost:3001"
        );


    socket.addEventListener(
        "open",
        () => {

            console.log(
                "[DOCK] Connected to server."
            );

        }
    );


    socket.addEventListener(
        "message",
        event => {

            try {

                const data =
                    JSON.parse(
                        event.data
                    );


                handleEvent(data);

            } catch (error) {

                console.error(
                    "[DOCK] Invalid message:",
                    error
                );

            }

        }
    );


    socket.addEventListener(
        "close",
        () => {

            setTimeout(
                connectWebSocket,
                2000
            );

        }
    );

}


/* ============================================================
   EVENT HANDLER
   ============================================================ */

function handleEvent(data) {


    if (
        data.type === "status"
    ) {

        updateStatus(
            data.connected,
            data.connecting
        );


        if (
            data.username
        ) {

            usernameDisplay.textContent =
                `@${data.username}`;

            usernameInput.value =
                data.username;

        }


        if (
            data.error
        ) {

            showError(
                data.error
            );

        }


        return;

    }


    if (
        data.type === "stats"
    ) {

        updateStats(data);

        return;

    }


    if (
        data.type === "viewers"
    ) {

        viewers.textContent =
            formatNumber(
                data.total
            );

        return;

    }


    if (
        data.type === "likes"
    ) {

        likes.textContent =
            formatNumber(
                data.total
            );

        return;

    }


    if (
        data.type === "usernameSaved"
    ) {

        usernameDisplay.textContent =
            `@${data.username}`;

        usernameInput.value =
            data.username;

        clearError();

        return;

    }


    if (
        data.type === "error"
    ) {

        showError(
            data.message
        );

    }

}


/* ============================================================
   STATS
   ============================================================ */

function updateStats(data) {

    viewers.textContent =
        formatNumber(
            data.viewers
        );


    likes.textContent =
        formatNumber(
            data.likes
        );


    followers.textContent =
        data.totalFollowers === null ||
        data.totalFollowers === undefined
            ? "—"
            : formatNumber(
                data.totalFollowers
            );


    newFollowers.textContent =
        formatNumber(
            data.newFollowers
        );


    diamonds.textContent =
        formatNumber(
            data.diamonds
        );


    usd.textContent =
        `$${Number(
            data.estimatedUsd ?? 0
        ).toFixed(2)}`;

}


/* ============================================================
   STATUS
   ============================================================ */

function updateStatus(
    connected,
    connecting
) {

    if (
        connected
    ) {

        statusText.textContent =
            "LIVE CONNECTED";

        statusDot.className =
            "status-dot online";

        return;

    }


    if (
        connecting
    ) {

        statusText.textContent =
            "CONNECTING...";

        statusDot.className =
            "status-dot connecting";

        return;

    }


    statusText.textContent =
        "LIVE DISCONNECTED";

    statusDot.className =
        "status-dot";

}


/* ============================================================
   USERNAME
   ============================================================ */

function saveUsername() {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        showError(
            "Dashboard server is not connected."
        );

        return;

    }


    let value =
        usernameInput.value
            .trim()
            .replace(/^@/, "");


    if (
        !value
    ) {

        showError(
            "Enter a TikTok username."
        );

        return;

    }


    clearError();


    connectButton.disabled =
        true;

    connectButton.textContent =
        "CONNECTING...";


    socket.send(
        JSON.stringify({

            type: "setUsername",

            username:
                value

        })
    );


    setTimeout(
        () => {

            connectButton.disabled =
                false;

            connectButton.textContent =
                "SAVE & CONNECT";

        },
        1500
    );

}


connectButton.addEventListener(
    "click",
    saveUsername
);


usernameInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            saveUsername();

        }

    }
);


/* ============================================================
   UTILITIES
   ============================================================ */

function formatNumber(number) {

    return Number(
        number ?? 0
    ).toLocaleString();

}


function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


function clearError() {

    errorBox.style.display =
        "none";

}


/* ============================================================
   START
   ============================================================ */

connectWebSocket();

</script>

</body>

</html>
